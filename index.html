var WORK_KEY="work-done-v1";
function readWorkJson(s){try{var j=JSON.parse(s);if(j&&Array.isArray(j.items))return j;}catch(e){}return null;}
var WORK=readWorkJson((document.getElementById("work-embed")||{}).textContent)||{updated:"11/18 16:50",items:[]};
function loadWorkDone(){try{var s=localStorage.getItem(WORK_KEY);if(s){var o=JSON.parse(s);if(o&&typeof o==="object"&&!Array.isArray(o))return o;}}catch(e){}return {};}
var WDONE=loadWorkDone();
function saveWorkDone(){try{localStorage.setItem(WORK_KEY,JSON.stringify(WDONE));}catch(e){toast("저장 공간에 저장하지 못했어요");}}
function workState(w){var o=WDONE[w.id];if(o===0)return w.state==="done"?"doing":(w.state||"doing");if(typeof o==="number"&&o>0)return"done";return w.state||"wait";}
function workIsDone(w){return workState(w)==="done";}
function togWork(id){var w=(WORK.items||[]).filter(function(x){return x.id===id;})[0];if(!w)return;if(workIsDone(w)){if(w.state==="done")WDONE[id]=0;else delete WDONE[id];}else WDONE[id]=Date.now();saveWorkDone();}
function renderWork(){
 var area=S.workArea||"전체";
 var items=(WORK.items||[]).filter(function(w){return area==="전체"||w.area===area;});
 var wait=items.filter(function(w){return workState(w)==="wait";});
 var ing=items.filter(function(w){return workState(w)==="doing";});
 var fin=items.filter(function(w){return workState(w)==="done";});
 var h='<div class="hero"><div class="lbl">업데이트 '+esc(WORK.updated||"")+'</div>'+
  '<h1>확인을 <span class="m">'+wait.length+'개</span> 기다려요</h1>'+
  '<div class="sub">진행 중 '+ing.length+'개 · 완료 '+fin.length+'개 · 이름을 누르면 단계가 보여요</div></div>';
 h+='<div class="pills">'+["전체","인스타툰","블로그"].map(function(a){return'<button class="pill'+(area===a?' on':'')+'" data-act="workArea" data-v="'+a+'">'+a+'</button>';}).join("")+'</div>';
 function row(w){
  var all=(w.steps||[]).length,got=(w.steps||[]).filter(function(s){return s.done;}).length,ok=workIsDone(w),open=S.workOpen===w.id;
  var sub=(area==="전체"?esc(w.area)+" · ":"")+got+"/"+all+"단계";
  var html='<div class="row"><button class="chk'+(ok?' on':'')+'" data-act="workTog" data-id="'+esc(w.id)+'" aria-label="완료 체크">'+(ok?'✓':'')+'</button>'+
   '<button class="tap" data-act="workOpen" data-id="'+esc(w.id)+'"><div class="n wn" style="'+(ok?'color:var(--t3)':'')+'">'+esc(w.title)+'</div><div class="d">'+sub+'</div></button>'+
   '<button class="state" data-act="workOpen" data-id="'+esc(w.id)+'" style="border:none;background:none;cursor:pointer;padding:0">'+(open?'▲':'▼')+'</button></div>';
  if(open){
   var pct=all?Math.round(got/all*100):0;
   html+='<div class="wbox"><div class="bar"><i style="width:'+pct+'%"></i></div>';
   (w.steps||[]).forEach(function(s){html+='<div class="wstep"><span class="wdot'+(s.done?' on':'')+'">'+(s.done?'✓':'')+'</span><span style="'+(s.done?'color:var(--t2)':'font-weight:600')+'">'+esc(s.t)+'</span></div>';});
   if(w.next)html+='<div class="wnext">다음: '+esc(w.next)+'</div>';
   html+='</div>';
  }
  return html;
 }
 function group(name,list){if(!list.length)return"";return'<div class="card"><div class="whead">'+name+' <span class="'+(name==="확인 기다려요"?'m':'')+'">'+list.length+'</span></div>'+list.map(row).join("")+'</div>';}
 h+=group("확인 기다려요",wait)+group("진행 중",ing);
 if(fin.length){h+='<button class="btn sub" style="width:100%" data-act="workShowDone">'+(S.workShowDone?'완료 접기':'완료 '+fin.length+'개 보기')+'</button>';if(S.workShowDone)h+=group("완료",fin);}
 return h;}

function editRoutine(r){var isNew=!r;var days=r?r.days.slice():ALL.slice();
 sheet('<div class="ttl" style="margin-top:0">'+(isNew?'루틴 추가':'루틴 수정')+'</div><input class="inp" id="rName" style="margin-top:14px" maxlength="40" placeholder="루틴 이름" value="'+(r?esc(r.name):'')+'">'+
 '<div class="lbl" style="margin-top:16px">하는 요일</div><div class="daysel" id="rDays">'+WD.map(function(w,i){return'<button class="dbtn'+(days.indexOf(i)>=0?' on':'')+'" data-i="'+i+'">'+w+'</button>';}).join("")+'</div>'+
 '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm sub" data-x="all">매일</button><button class="btn sm sub" data-x="wk">평일</button><button class="btn sm sub" data-x="we">주말</button></div>'+
 '<div style="display:flex;gap:8px;margin-top:20px">'+(isNew?'':'<button class="btn danger" data-x="del">삭제</button>')+'<button class="btn sub" style="flex:1" data-x="cancel">취소</button><button class="btn" style="flex:1" data-x="save">저장</button></div>',
 function(bg,close){var box=bg.querySelector("#rDays");function paint(){box.querySelectorAll(".dbtn").forEach(function(b){b.classList.toggle("on",days.indexOf(+b.dataset.i)>=0);});}
  box.onclick=function(e){var b=e.target.closest(".dbtn");if(!b)return;var i=+b.dataset.i,p=days.indexOf(i);if(p>=0)days.splice(p,1);else days.push(i);paint();};

   D.routines=D.routines.filter(function(x){return x.id!==r.id;});Object.keys(D.done).forEach(function(k){D.done[k]=D.done[k].filter(function(id){return id!==r.id;});if(!D.done[k].length)delete D.done[k];});save();render();toast("삭제했어요");});};
  bg.querySelector('[data-x=save]').onclick=function(){var n=bg.querySelector("#rName").value.trim();if(!n){toast("이름을 입력해 주세요");return;}
   days.sort();if(isNew)D.routines.push({id:uid(),name:n,days:days});else{r.name=n;r.days=days;}save();close();render();toast(isNew?"추가했어요":"저장했어요");};
  if(isNew)setTimeout(function(){bg.querySelector("#rName").focus();},50);});}

  case"togTodo":D.todos.forEach(function(x){if(x.id===id)x.done=!x.done;});save();render();break;
  case"delTodo":var x=D.todos.filter(function(x){return x.id===id;})[0];confirmSheet("'"+esc(x.text)+"' 할 일을 삭제할까요?","삭제",function(){D.todos=D.todos.filter(function(y){return y.id!==id;});save();render();});break;
  case"copy":var txt=exportText();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){toast("복사했어요");},function(){fallbackCopy(txt);});}else fallbackCopy(txt);break;
  case"download":var blob=new Blob([exportText()],{type:"application/json"}),u=URL.createObjectURL(blob),an=document.createElement("a");an.href=u;an.download="routine-backup-"+key(today())+".json";document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);toast("파일로 저장했어요");break;
  case"importText":var tv=document.getElementById("impText").value.trim();if(!tv){toast("백업 내용을 붙여 넣어 주세요");break;}doImport(tv);break;
  case"pickFile":document.getElementById("impFile").click();break;
  case"reset":confirmSheet("모든 기록을 지울까요?<div class='hint'>루틴, 완료 기록, 할 일이 처음 상태로 돌아가요. 되돌릴 수 없어요.</div>","모두 지우기",function(){D=seed();save();render();toast("초기화했어요");});break;
 }});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.id==="todoIn"){var b=document.querySelector('[data-act=addTodo]');if(b)b.click();}});
document.addEventListener("change",function(e){if(e.target.id==="impFile"&&e.target.files[0]){var r=new FileReader();r.onload=function(){doImport(String(r.result));};r.readAsText(e.target.files[0]);e.target.value="";}});
function fallbackCopy(txt){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();toast(ok?"복사했어요":"복사가 안 돼서 파일로 저장해 주세요");}
// refresh when day changes or app resumes
var lastDay=key(today());document.addEventListener("visibilitychange",function(){if(!document.hidden&&key(today())!==lastDay){if(S.sel===lastDay)S.sel=key(today());lastDay=key(today());render();}});
render();
if("serviceWorker"in navigator&&location.protocol!=="file:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
window.__routine={get:function(){return D;},KEY:KEY};
window.__work={get:function(){return WORK;},getDone:function(){return WDONE;},KEY:WORK_KEY};
if(location.protocol!=="file:"){fetch("./work.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("work.json");return r.json();}).then(function(j){var w=readWorkJson(JSON.stringify(j));if(w){WORK=w;if(S.page==="work")render();}}).catch(function(){});}
})();
